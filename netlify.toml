# Bilder und Videos für den Instagram-Autopost: abrufbar für Instagram, aber nicht in Google
# (bewusst kein Eintrag in robots.txt, damit Instagram die Dateien weiter laden darf)
[[headers]]
  for = "/assets/instagram/*"
  [headers.values]
    X-Robots-Tag = "noindex, noimageindex"

# Gratis-Selbstcheck (Link steht in der Brevo-Bestätigungsmail): abrufbar, aber nicht in Google
[[headers]]
  for = "/downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex"
